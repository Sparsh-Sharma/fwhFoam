[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfwh"
version = "1.0.0"
description = "Python companion tools for the fwhFoam Ffowcs Williams-Hawkings solver"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Sparsh Sharma", email = "sssparsh14@gmail.com" }]
keywords = ["aeroacoustics", "ffowcs-williams-hawkings", "openfoam", "acoustics"]
dependencies = ["numpy>=1.20", "scipy>=1.7"]

[project.optional-dependencies]
plot = ["matplotlib>=3.4"]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["pyfwh"]
